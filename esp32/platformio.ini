[platformio]
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; ---------- N16R8 核心硬件配置（16MB QIO Flash + 8MB OPI PSRAM） ----------
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
; 烧录端参数与硬件严格对齐，避免模式/容量不匹配导致启动循环
board_upload.flash_size = 16MB
board_upload.flash_mode = qio
board_upload.maximum_size = 16777216
; ---------- 基础编译选项 ----------
; 不覆盖板级 USB 宏，保持板级默认 ARDUINO_USB_MODE=1：
;   Serial 走 UART0 (GPIO43/44) -> 板载 CH340 对应的那个 USB-C 口，
;   烧录和看日志用同一个口，最省事。
;
; 注意：不要再加 build_unflags = -DARDUINO_USB_MODE=1。
;       把板级定义撤掉后该宏变成"未定义"，#if ARDUINO_USB_MODE 按 0 处理，
;       反而会切到原生 USB-Serial/JTAG，等于帮倒忙。
; 也不要再定义 -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=1：
;       那会把 Serial 切到原生 USB 口，CH340 口就再也看不到任何日志了。
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
monitor_speed = 115200